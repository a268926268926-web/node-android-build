name: Build Node.js for Android

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node 版本: lts(最新LTS) / 主版本(如 24) / 完整版本(如 24.19.0)'
        default: lts
        required: false
      target_arch:
        description: '目标架构 (all=全部 4 架构)'
        default: all
        options: [all, arm64, arm, x64, ia32]
  schedule:
    # 每月 5 日 02:20 UTC 检查并构建最新 LTS (全部架构)
    # node LTS 补丁版约每月发布一次 (多为周二); 偶数大版本 10 月转 LTS
    - cron: '20 2 5 * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 手动选择具体架构时只构建该架构; 默认/schedule 构建全部 4 架构
        arch: ${{ (inputs.target_arch || 'all') == 'all' && fromJSON('["arm64","arm","x64","ia32"]') || fromJSON(format('["{0}"]', inputs.target_arch || 'all')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # multilib: arm/ia32 (32 位目标) 的 host 工具链用 -m32 编译, 需要 32 位 glibc/libstdc++ 头文件
        run: sudo apt-get update && sudo apt-get install -y ninja-build xz-utils patch gcc-multilib g++-multilib

      - name: Build
        env:
          NODE_VERSION: ${{ inputs.node_version || 'lts' }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          ./build.sh
          ls -lh out/*.tar.xz 2>/dev/null || true

      - name: Export version
        run: echo "NODE_VER=$(cat out/version.txt)" >> "$GITHUB_ENV"

      - name: Upload artifact
        if: hashFiles('out/*.tar.xz') != ''
        uses: actions/upload-artifact@v4
        with:
          name: node-android-${{ matrix.arch }}-${{ env.NODE_VER }}
          path: out/*.tar.xz
          if-no-files-found: error

      # 历史版本保留: 每个版本一个独立 release tag, 不可变
      - name: Upload release
        if: hashFiles('out/*.tar.xz') != ''
        uses: ncipollo/release-action@v1.14.0
        with:
          tag: node-android-${{ matrix.arch }}-${{ env.NODE_VER }}
          artifacts: out/*.tar.xz
          body: |
            Node.js for Android (${{ matrix.arch }}), 自包含二进制 (--partly-static)
            构建记录: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
